<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="screen" x1="100" y1="56" x2="100" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <mask id="jaw" maskUnits="userSpaceOnUse" x="-80" y="-120" width="160" height="240">
      <rect x="-80" y="-120" width="160" height="240" fill="#FFFFFF"/>
      <rect x="-11" y="-100" width="22" height="46" rx="4" fill="#000000"/>
    </mask>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="1" y="1" width="254" height="254" rx="57" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

  <rect x="60" y="53" width="80" height="150" rx="20" fill="url(#screen)" stroke="#FFFFFF" stroke-width="9"/>
  <rect x="86" y="67" width="28" height="9" rx="4.5" fill="#FFFFFF"/>

  <g transform="translate(150 160) rotate(45) scale(0.92)">
    <g mask="url(#jaw)" stroke="#2F6FF0" stroke-width="16" stroke-linejoin="round">
      <circle cx="0" cy="-50" r="30"/>
      <rect x="-12" y="-50" width="24" height="96" rx="12"/>
    </g>
    <g mask="url(#jaw)" fill="#FFFFFF">
      <circle cx="0" cy="-50" r="30"/>
      <rect x="-12" y="-50" width="24" height="96" rx="12"/>
    </g>
  </g>
</svg>
